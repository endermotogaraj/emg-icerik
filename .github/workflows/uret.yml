name: Icerik Uret

on:
  workflow_dispatch:
    inputs:
      is:
        description: 'İş bilgisi (JSON)'
        required: true

permissions:
  contents: write

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Kutuphaneler
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q -r requirements.txt

      - name: Arka plan silme modeli (onbellek)
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-isnet-v1

      - name: Fontlar
        run: |
          mkdir -p fontlar
          curl -sSfL -o fontlar/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf || true
          curl -sSfL -o fontlar/Oswald.ttf "https://github.com/google/fonts/raw/main/ofl/oswald/Oswald%5Bwght%5D.ttf" || true

      - name: Uret
        env:
          IS: ${{ github.event.inputs.is }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python uret.py

      - name: Kaydet
        run: |
          git config user.name "emg-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cikti
          git commit -q -m "Uretim $(date +%F_%T)" || echo "degisiklik yok"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
